<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Projects | Piyush Garg</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta name="description" content="All GitHub projects by Piyush Garg — AI Engineer focused on ML, Deep Learning, and algorithmic foundations." />

    <link rel="stylesheet" href="style.css" />
    <style>
        /* ===== PAGE-SPECIFIC STYLES ===== */
        .projects-page {
            min-height: 100vh;
            padding: 120px 40px 80px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .page-header p {
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .page-header .gh-link {
            display: inline-block;
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .page-header .gh-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 40px 0 36px;
        }

        .filter-btn {
            padding: 7px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: var(--muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .filter-btn:hover {
            border-color: rgba(139, 92, 246, 0.4);
            color: var(--text);
        }

        .filter-btn.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--accent);
            color: #fff;
        }

        /* Repo grid */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* Repo card */
        .repo-card {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 24px 26px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.3s ease,
                        background 0.3s ease;
        }

        .repo-card:hover {
            transform: translateY(-3px);
            background: rgba(139, 92, 246, 0.06);
            box-shadow: 0 8px 28px -6px rgba(139, 92, 246, 0.12),
                        0 4px 12px -4px rgba(0, 0, 0, 0.2);
        }

        .repo-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent), var(--accent2));
            border-radius: 3px 0 0 3px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .repo-card:hover::after {
            opacity: 1;
        }

        .repo-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.25s ease;
        }

        .repo-card:hover .repo-name {
            color: #fff;
        }

        .repo-name .arrow {
            font-size: 0.85rem;
            opacity: 0;
            transform: translateX(-4px);
            transition: all 0.25s ease;
            color: var(--accent);
        }

        .repo-card:hover .repo-name .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .repo-desc {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.55;
            flex: 1;
        }

        .repo-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 6px;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .repo-lang {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lang-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .repo-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .repo-stat svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            opacity: 0.7;
        }

        /* Loading skeleton */
        .skeleton-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 24px 26px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skeleton-line {
            height: 14px;
            border-radius: 6px;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.04) 25%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.04) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line.w60 { width: 60%; }
        .skeleton-line.w80 { width: 80%; }
        .skeleton-line.w40 { width: 40%; height: 10px; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Error state */
        .error-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .error-msg h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .error-msg a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Pinned badge */
        .pinned-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.25);
            padding: 2px 10px;
            border-radius: 12px;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        /* Count badge */
        .repo-count {
            text-align: center;
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .projects-page {
                padding: 100px 20px 60px;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .repo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="progress-bar"></div>
    <div class="cursor-glow"></div>

    <!-- HEADER -->
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="brand">Piyush Garg</a>
            <div class="nav-links">
                <a href="index.html#about">About</a>
                <a href="index.html#projects">Projects</a>
                <a href="index.html#skills">Skills</a>
                <a href="index.html#contact">Contact</a>
                <a href="piyushGarg.pdf" download class="resume-btn">Resume</a>
            </div>
        </nav>
    </header>

    <main class="projects-page">
        <div class="page-header">
            <h1>All Projects</h1>
            <p>A collection of things I've built and contributed to.</p>
            <a href="https://github.com/Piyushgarg06" target="_blank" class="gh-link">github.com/Piyushgarg06 ↗</a>
        </div>

        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-lang="all">All</button>
        </div>

        <div class="repo-grid" id="repoGrid">
            <!-- Skeleton loaders -->
            <div class="skeleton-card"><div class="skeleton-line w60"></div><div class="skeleton-line w80"></div><div class="skeleton-line w40"></div></div>
            <div class="skeleton-card"><div class="skeleton-line w60"></div><div class="skeleton-line w80"></div><div class="skeleton-line w40"></div></div>
            <div class="skeleton-card"><div class="skeleton-line w60"></div><div class="skeleton-line w80"></div><div class="skeleton-line w40"></div></div>
            <div class="skeleton-card"><div class="skeleton-line w60"></div><div class="skeleton-line w80"></div><div class="skeleton-line w40"></div></div>
            <div class="skeleton-card"><div class="skeleton-line w60"></div><div class="skeleton-line w80"></div><div class="skeleton-line w40"></div></div>
            <div class="skeleton-card"><div class="skeleton-line w60"></div><div class="skeleton-line w80"></div><div class="skeleton-line w40"></div></div>
        </div>

        <div class="repo-count" id="repoCount"></div>
    </main>

    <footer class="footer">
        <span>Piyush Garg</span>
        <span>© <span id="footerYear"></span> All rights reserved.</span>
    </footer>

    <script src="script.js"></script>
    <script>
        const GITHUB_USER = 'Piyushgarg06';
        const grid = document.getElementById('repoGrid');
        const filterBar = document.getElementById('filterBar');
        const countEl = document.getElementById('repoCount');

        // Repos to pin at the top
        const PINNED_REPOS = ['TriageIQ', 'SynapseAI', 'diffusion-calorimeter-generation'];

        // Language colors (GitHub-style)
        const langColors = {
            'Python': '#3572A5',
            'JavaScript': '#f1e05a',
            'TypeScript': '#3178c6',
            'HTML': '#e34c26',
            'CSS': '#563d7c',
            'C': '#555555',
            'C++': '#f34b7d',
            'Jupyter Notebook': '#DA5B0B',
            'Shell': '#89e051',
            'Java': '#b07219',
            'Rust': '#dea584',
            'Go': '#00ADD8',
        };

        let allRepos = [];

        function sortWithPinned(repos) {
            const pinned = repos.filter(r => PINNED_REPOS.includes(r.name));
            const rest = repos.filter(r => !PINNED_REPOS.includes(r.name));
            // Keep pinned in the order defined in PINNED_REPOS
            pinned.sort((a, b) => PINNED_REPOS.indexOf(a.name) - PINNED_REPOS.indexOf(b.name));
            return [...pinned, ...rest];
        }

        async function fetchRepos() {
            try {
                const res = await fetch(
                    `https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated&direction=desc`
                );

                if (!res.ok) throw new Error(`GitHub API responded with ${res.status}`);

                allRepos = await res.json();

                // Filter out forks (optional, keeps only original work)
                allRepos = allRepos.filter(r => !r.fork);

                buildFilters();
                renderRepos(sortWithPinned(allRepos));
            } catch (err) {
                grid.innerHTML = `
                    <div class="error-msg" style="grid-column: 1 / -1;">
                        <h3>Couldn't load repositories</h3>
                        <p>${err.message}</p>
                        <p style="margin-top: 12px;">
                            Visit <a href="https://github.com/${GITHUB_USER}" target="_blank">GitHub ↗</a> directly.
                        </p>
                    </div>
                `;
            }
        }

        function buildFilters() {
            const langs = [...new Set(allRepos.map(r => r.language).filter(Boolean))];
            // Pin Python and Jupyter Notebook first, rest alphabetically
            const pinned = ['Python', 'Jupyter Notebook'];
            const rest = langs.filter(l => !pinned.includes(l)).sort();
            const ordered = [...pinned.filter(l => langs.includes(l)), ...rest];

            ordered.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.lang = lang;
                btn.textContent = lang;
                filterBar.appendChild(btn);
            });

            filterBar.addEventListener('click', e => {
                if (!e.target.classList.contains('filter-btn')) return;

                filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const lang = e.target.dataset.lang;
                const filtered = lang === 'all'
                    ? allRepos
                    : allRepos.filter(r => r.language === lang);

                renderRepos(sortWithPinned(filtered));
            });
        }

        function renderRepos(repos) {
            grid.innerHTML = repos.map(repo => {
                const isPinned = PINNED_REPOS.includes(repo.name);
                return `
                <a href="${repo.html_url}" target="_blank" class="repo-card">
                    <div class="repo-name">
                        ${formatName(repo.name)}
                        ${isPinned ? '<span class="pinned-badge">📌 Pinned</span>' : ''}
                        <span class="arrow">↗</span>
                    </div>
                    <div class="repo-desc">${repo.description || '<span style="opacity:0.4;">No description</span>'}</div>
                    <div class="repo-meta">
                        ${repo.language ? `
                            <span class="repo-lang">
                                <span class="lang-dot" style="background:${langColors[repo.language] || '#888'}"></span>
                                ${repo.language}
                            </span>
                        ` : ''}
                        ${repo.stargazers_count > 0 ? `
                            <span class="repo-stat">
                                <svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
                                ${repo.stargazers_count}
                            </span>
                        ` : ''}
                        ${repo.forks_count > 0 ? `
                            <span class="repo-stat">
                                <svg viewBox="0 0 16 16"><path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 100-1.5.75.75 0 000 1.5z"/></svg>
                                ${repo.forks_count}
                            </span>
                        ` : ''}
                    </div>
                </a>
            `}).join('');

            countEl.textContent = `Showing ${repos.length} project${repos.length !== 1 ? 's' : ''}`;
        }

        function formatName(name) {
            return name
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        fetchRepos();
    </script>
</body>

</html>
